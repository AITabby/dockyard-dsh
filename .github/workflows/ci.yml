name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        # package.json engines: ^22.19.0 || >=24.0.0
        node-version: ["22.19", "24"]
    runs-on: ubuntu-latest
    steps:
      # Full history: tests/market-index.test.mjs verifies that every release
      # entry pins a commit that actually exists in the repository.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/dsh-plugin/pnpm-lock.yaml
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile
      - name: Install plugin dependencies
        working-directory: packages/dsh-plugin
        run: pnpm install --frozen-lockfile
      - name: Run test suite
        run: pnpm test

  plugin-bundle:
    # The published bundle builds from packages/dsh-plugin with its own
    # authoritative pnpm lockfile.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install with frozen lockfile
        working-directory: packages/dsh-plugin
        run: pnpm install --frozen-lockfile
      - name: Build bundle
        working-directory: packages/dsh-plugin
        run: pnpm build

  windows-tests:
    # Windows surface: provider CLIs ship as `.cmd` shims there, which
    # CreateProcess cannot launch directly, so the CLI transport has to route
    # them through ComSpec. The full suite runs here so a POSIX-only assumption
    # cannot creep back in unnoticed.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/dsh-plugin/pnpm-lock.yaml
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile
      - name: Install plugin dependencies
        working-directory: packages/dsh-plugin
        run: pnpm install --frozen-lockfile
      - name: Run test suite
        run: pnpm test

  macos-gates:
    # Native surfaces that only exercise on macOS: the real Keychain helper
    # round-trip and Swift syntax gates for the app + keychain helper sources.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/dsh-plugin/pnpm-lock.yaml
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile
      - name: Install plugin dependencies
        working-directory: packages/dsh-plugin
        run: pnpm install --frozen-lockfile
      - name: Full suite (Keychain tests execute for real on macOS)
        run: pnpm test
      - name: Swift syntax gates
        run: |
          xcrun swiftc -parse apps/macos/DockyardDSH/Sources/main.swift
          xcrun swiftc -parse packages/vault/src/macos-keychain-helper.swift
      - name: Build script syntax gate
        run: bash -n apps/macos/build-dmg.sh
